# P2P client only: the phone can never be the group owner (no AP role in the
# wl1271 firmware), so the intent is 0 and the group interface is wlan0 itself.
ctrl_interface=/var/run/wpa_supplicant_imira
update_config=0
device_name=N950-Imira
device_type=10-0050F204-5
config_methods=virtual_push_button keypad
p2p_no_group_iface=1
p2p_go_intent=0
